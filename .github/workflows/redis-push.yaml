name: Deploy Redis
permissions:
  contents: read
  deployments: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - test
          - main

env:
  HELM_RELEASE_NAME: redis-retry-deployment

jobs:     
  deploy:
      environment: ${{ github.event.inputs.environment }}
      runs-on: ubuntu-22.04

      steps:
        - name: Checkout the repository
          uses: actions/checkout@v4

        - name: Authenticate with OpenShift
          uses: redhat-actions/oc-login@5eb45e848b168b6bf6b8fe7f1561003c12e3c99d #v1.3
          with:
            openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
            namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
            openshift_token: ${{ secrets.OPENSHIFT_SERVICE_ACCOUNT_TOKEN }}
            insecure_skip_tls_verify: true

        - name: Deploy with Helm
          run: |
            helm upgrade -f redis/values.yaml \
              --install ${{ env.HELM_RELEASE_NAME }} ./redis \
              --namespace ${{ secrets.OPENSHIFT_NAMESPACE }}