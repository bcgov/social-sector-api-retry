apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.deployment.name }}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.deployment.name }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /conf/redis.conf
          env:
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  key: password
                  name: {{ .Values.secret.name }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - redis-cli -h $HOSTNAME shutdown nosave
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test "$(redis-cli -h $HOSTNAME ping)" == "PONG"
            initialDelaySeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          ports:
            - containerPort: 6379
              name: redis
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test "$(redis-cli -h $HOSTNAME ping)" == "PONG"
            initialDelaySeconds: 15
            timeoutSeconds: 1
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: conf
              mountPath: /conf
              readOnly: false
            - name: data
              mountPath: /data
              readOnly: false
      volumes:
        - name: conf
          secret:
            secretName: {{ .Values.secret.name }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.name }}
